name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/check-repository.mjs
  application:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [server, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate
      - if: matrix.directory == 'frontend'
        run: npm run build
        env:
          VITE_API_BASE_URL: https://smart-pg-manager-backend.onrender.com/api
      - if: matrix.directory == 'frontend'
        run: npm run test:build
